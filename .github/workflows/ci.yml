name: CI
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build ./cmd/bot
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper-python/requirements.txt
      - run: pip install -r scraper-python/requirements.txt
      - run: pip install ruff
      - run: python -m py_compile scraper-python/JoblessYu.py
      - run: ruff check scraper-python/
